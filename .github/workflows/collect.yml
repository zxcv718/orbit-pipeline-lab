name: collect

# 매시 실행한다. 수집 스크립트가 CelesTrak 이용 정책(2시간 갱신당 1회)을 확인해 실제 요청 여부를 정하고,
# 통계, 변경 비교 결과, 정적 대시보드를 커밋하고 배포한다.
# - 17분에 실행하는 이유: 정각에는 GitHub Actions 예약 실행이 몰려 지연이 커지고,
#   데이터 제공처에도 요청이 몰린다. Space-Track도 정각과 30분을 피하도록 권고한다.
# - 실행 주기(매시)와 실제 요청 주기(2시간당 1회)를 분리한다.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 예약 시각 계산 (스케줄 지연 측정용)
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import datetime as d
          n = d.datetime.now(d.timezone.utc)
          slot = n.replace(minute=17, second=0, microsecond=0)
          if slot > n:
              slot -= d.timedelta(hours=1)
          print(f"SCHEDULED_AT={slot.strftime('%Y-%m-%dT%H:%M:%SZ')}")
          PY

      - name: 수집 (정책 준수, 실패해도 멈추지 않음)
        run: python collect/fetch_gp.py

      - name: 스냅샷 통계
        run: python analyze/snapshot_stats.py || echo "스냅샷 없음, 직전 결과 유지"

      - name: 변경 감지
        run: python analyze/diff_snapshots.py || echo "스냅샷 없음, 직전 결과 유지"

      - name: 정적 페이지 생성
        run: python site/build_site.py

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manifest.jsonl data/results data/state || true
          git diff --staged --quiet || git commit -m "collect: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public
      - id: deploy
        uses: actions/deploy-pages@v4
